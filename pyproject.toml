[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bellium-ai"
version = "0.1.0"
description = "Open-source specialist AI: micro-NN, k-NN and hybrid models for lighter, faster intelligence."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Bellium AI contributors" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "pillow>=9.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
accelerated = [
    "numpy>=1.20.0",
]

[project.scripts]
bellium = "bellium.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bellium*", "legacy*"]

[tool.setuptools.package-data]
legacy = ["micro_nn/models/*.json", "micro_nn/provenance.json"]
