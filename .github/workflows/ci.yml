name: Bellium validation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python run_all_tests.py
      - run: python -m unittest discover -s examples/tests
      - run: python -m build
      - name: Install wheel and check bundled resources outside the checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I scripts/smoke_installed.py --image
